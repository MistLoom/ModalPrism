framework_version: "1"
id: tool
open: true
protocols: [fun, http, mcp]
depends: []
stateful: false
description: 工具面：取数、识别、适配、读取与声明固化的单一入口
methods:
  - id: catalog
    description: 列出全部工具动词及其参数
    input:
      type: object
  - id: once
    description: 一次完成 取数 → 识别 → 适配 → 写入或返回（类型未识别不失败）
    input:
      type: object
      properties:
        url: { type: string }
        text: { type: string }
        file: { type: string }
        mode: { type: string }
        hint: { type: string }
        sourceId: { type: string }
        selectors:
          type: array
          items: { type: string }
        pipeline:
          type: array
          items: { type: object }
        vectorize: { type: boolean }
  - id: probe
    description: 只识别不落库：类型分布、区域与建议声明
    input:
      type: object
      properties:
        url: { type: string }
        text: { type: string }
        file: { type: string }
        selectors:
          type: array
          items: { type: string }
  - id: save
    description: 把探测结论固化为信源声明
    input:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        accessor: { type: string }
        pipeline:
          type: array
          items: { type: object }
        schedule: { type: object }
      required: [name, url]
  - id: fetch
    description: 按地址取回正文
    input:
      type: object
      properties:
        url: { type: string }
        maxBytes: { type: number }
      required: [url]
  - id: search
    description: 用已配置的搜索引擎检索
    input:
      type: object
      properties:
        query: { type: string }
        engine: { type: string }
        limit: { type: number }
        scope: { type: string }
      required: [query]
  - id: parse
    description: 对文本或地址做结构化识别
    input:
      type: object
      properties:
        text: { type: string }
        url: { type: string }
        selectors:
          type: array
          items: { type: string }
  - id: read
    description: 读取已入库内容的详情或单面数据
    input:
      type: object
      properties:
        contentId: { type: string }
        facet: { type: string }
        variant: { type: string }
      required: [contentId]
  - id: ls
    description: 发现信源与可挂载组件；可按组件 kind 与标签过滤目录
    input:
      type: object
      properties:
        kind: { type: string }
        tag: { type: string }
  - id: plan.ls
    description: 列出采集计划（含 pipeline、vectorize 与运行态摘要）
    input:
      type: object
      properties:
        status: { type: string }
  - id: plan.get
    description: 读取采集计划详情（含 pipeline、vectorize 与进度）
    input:
      type: object
      properties:
        planId: { type: string }
      required: [planId]
  - id: plan.new
    description: 新建采集计划，可声明 pipeline 与 vectorize
    input:
      type: object
      properties:
        name: { type: string }
        targets: { type: array, items: { type: string } }
        trigger: { type: object }
        pipeline: { type: array, items: { type: object } }
        vectorize: { type: boolean }
        quota: { type: object }
        stopPolicy: { type: object }
        deliveryTargets: { type: array, items: { type: object } }
        deliveryEnabled: { type: boolean }
        description: { type: string }
      required: [targets]
  - id: plan.set
    description: 修改采集计划（trigger、pipeline、vectorize 与进度相关字段）
    input:
      type: object
      properties:
        planId: { type: string }
        trigger: { type: object }
        pipeline: { type: array, items: { type: object } }
        vectorize: { type: boolean }
        targets: { type: array, items: { type: string } }
        quota: { type: object }
        stopPolicy: { type: object }
        deliveryTargets: { type: array, items: { type: object } }
        deliveryEnabled: { type: boolean }
        enabled: { type: boolean }
        name: { type: string }
        description: { type: string }
      required: [planId]
  - id: plan.pause
    description: 暂停采集计划
    input:
      type: object
      properties:
        planId: { type: string }
      required: [planId]
  - id: plan.resume
    description: 恢复采集计划
    input:
      type: object
      properties:
        planId: { type: string }
      required: [planId]
  - id: plan.run
    description: 立即触发一次信源采集，返回异步操作
    input:
      type: object
      properties:
        sourceId: { type: string }
        mode: { type: string }
        locator: { type: string }
        reason: { type: string }
      required: [sourceId]
