framework_version: "1"
id: tool
open: true
protocols: [fun, http, mcp]
depends: []
stateful: false
description: 工具面：取数、识别、适配、读取与声明固化的单一入口
methods:
  - id: catalog
    description: 列出全部工具动词及其参数
    input:
      type: object
  - id: once
    description: 一次完成 取数 → 识别 → 适配 → 写入或返回（类型未识别不失败）
    input:
      type: object
      properties:
        url: { type: string }
        text: { type: string }
        file: { type: string }
        mode: { type: string }
        hint: { type: string }
        sourceId: { type: string }
        selectors:
          type: array
          items: { type: string }
        pipeline:
          type: array
          items: { type: object }
  - id: probe
    description: 只识别不落库：类型分布、区域与建议声明
    input:
      type: object
      properties:
        url: { type: string }
        text: { type: string }
        file: { type: string }
        selectors:
          type: array
          items: { type: string }
  - id: save
    description: 把探测结论固化为信源声明
    input:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        accessor: { type: string }
        pipeline:
          type: array
          items: { type: object }
        schedule: { type: object }
      required: [name, url]
  - id: fetch
    description: 按地址取回正文
    input:
      type: object
      properties:
        url: { type: string }
        maxBytes: { type: number }
      required: [url]
  - id: search
    description: 用已配置的搜索引擎检索
    input:
      type: object
      properties:
        query: { type: string }
        engine: { type: string }
        limit: { type: number }
      required: [query]
  - id: parse
    description: 对文本或地址做结构化识别
    input:
      type: object
      properties:
        text: { type: string }
        url: { type: string }
        selectors:
          type: array
          items: { type: string }
  - id: read
    description: 读取已入库内容的详情或单面数据
    input:
      type: object
      properties:
        contentId: { type: string }
        facet: { type: string }
        variant: { type: string }
      required: [contentId]
