framework_version: "1"
id: egress
open: true
protocols: [fun, http]
depends: [strata_read, strata_write]
stateful: true
description: 出站检查与正向代理状态
methods:
  - id: check
    description: 检查地址是否被私网规则挡住
    input:
      type: object
  - id: status
    description: 返回正向代理地址
    input:
      type: object
  - id: report
    description: 导出出站拦截统计
    input:
      type: object
  - id: reset
    description: 清零指定主机的拦截计数
    input:
      type: object
