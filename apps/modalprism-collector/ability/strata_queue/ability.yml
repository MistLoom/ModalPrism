framework_version: "1"
id: strata_queue
open: false
protocols: [fun, http]
depends: [strata_write]
stateful: true
description: 控制库任务队列
methods:
  - id: enqueue
    description: 写入任务
    input:
      type: object
  - id: lease
    description: 租约一批任务
    input:
      type: object
  - id: extend
    description: 延长租约
    input:
      type: object
  - id: nack
    description: 退回任务
    input:
      type: object
  - id: list
    description: 按队列与状态列出任务
    input:
      type: object
      properties:
        queue: { type: string }
        status: { type: string, enum: [queued, leased, done, cancelled] }
        source: { type: string }
        reason: { type: string }
        query: { type: string }
        before: { type: string }
        cursor: { type: string }
        limit: { type: integer }
  - id: transition
    description: 对选中的任务执行取消、重排或删除，单条与批量走同一状态机约束
    input:
      type: object
      properties:
        taskIds:
          type: array
          items: { type: string }
        action: { type: string, enum: [cancel, requeue, remove] }
      required: [taskIds, action]
  - id: stats
    description: 任务队列统计
    input:
      type: object
