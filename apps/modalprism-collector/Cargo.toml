[package]
name = "modalprism-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "一条命令初始化存储并进入采集循环"
publish = false

[dependencies]
ability-core.workspace = true
ability-support.workspace = true
ability-workflow = { path = "../../abilitys/ops/workflow" }
accessor_probe = { path = "ability/accessor_probe" }
assembly = { path = "subsystems/assembly" }
async-trait.workspace = true
axum = "0.8"
catalog_admin = { path = "../../abilitys/data/catalog_admin" }
committer = { path = "ability/committer" }
content_admin = { path = "ability/content_admin" }
ability-config-admin = { path = "ability/config_admin" }
ability-egress = { path = "ability/egress" }
ability-planner = { path = "ability/planner" }
config = { path = "../modalprism-domain/config" }
config_inspect = { path = "../../abilitys/data/config_inspect" }
frame-core.workspace = true
frame-port-http.workspace = true
health = { path = "../../abilitys/ops/health" }
health_record = { path = "ability/health_record" }
paid_gateway = { path = "ability/paid_gateway" }
runner = { path = "ability/runner" }
serde.workspace = true
serde_json.workspace = true
strata_queue = { path = "ability/strata_queue" }
strata_read = { path = "../../abilitys/data/strata_read" }
strata_write = { path = "ability/strata_write" }
type_article = { path = "../../abilitys/types/type_article" }
strata-model = { path = "../modalprism-domain/strata-model" }
surface = { path = "../modalprism-domain/surface" }
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
types = { path = "../modalprism-domain/types" }

[features]
# 本地一键启动默认走外部 RustFS 发行包，不用编译 rustfs。
default = ["rustfs-bin"]
# 下游数据层后端，直接决定 `cargo run` 编译哪个 Blob 实现。
postgres = ["assembly/postgres"]
s3 = ["assembly/s3"]
rustfs-bin = ["assembly/rustfs-bin"]
embedded-s3 = ["assembly/embedded-s3"]

[dev-dependencies]
modalprism-agent = { path = "../modalprism-agent" }
reqwest.workspace = true
serde.workspace = true
serde_yaml.workspace = true
strata-client = { path = "../modalprism-domain/strata-client" }
strata-model = { path = "../modalprism-domain/strata-model" }
tempfile.workspace = true

[lints]
workspace = true
