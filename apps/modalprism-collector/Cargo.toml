[package]
name = "modalprism-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "一条命令初始化存储并进入采集循环"
publish = false
build = "build.rs"

[dependencies]
ability-core.workspace = true
ability-support.workspace = true
async-trait.workspace = true
axum = "0.8"
collector-boot = { path = "../../crates/collector-boot" }
collector-gateway = { path = "../../crates/collector-gateway" }
collector-runtime = { path = "../../crates/collector-runtime" }
console-api = { path = "../../crates/console-api" }
mime_guess = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
tower-http = { version = "0.6", features = ["fs"] }
ability-committer = { path = "../../abilitys/storage/committer" }
ability-control-state = { path = "../../abilitys/storage/control-state" }
ability-config = { path = "../../abilitys/governance/config" }
ability-egress = { path = "../../abilitys/network/egress" }
ability-collector-planner = { path = "../../abilitys/collector/planner" }
ability-collector-runner = { path = "../../abilitys/collector/runner" }
ability-paid-gateway = { path = "../../abilitys/network/paid-gateway" }
config = { path = "../../crates/config" }
ability-config-inspect = { path = "../../abilitys/governance/config-inspect" }
frame-core.workspace = true
frame-port-http.workspace = true
accessors = { path = "../../crates/accessors" }
serde.workspace = true
serde_json.workspace = true
ability-strata-queue = { path = "../../abilitys/storage/strata-queue" }
ability-strata-read = { path = "../../abilitys/storage/strata-read" }
ability-strata-write = { path = "../../abilitys/storage/strata-write" }
strata-model = { path = "../../crates/strata-model" }
tokio = { workspace = true, features = ["signal"] }
types = { path = "../../crates/types" }

[dev-dependencies]
strata-client = { path = "../../crates/strata-client" }
strata-model = { path = "../../crates/strata-model" }
tempfile.workspace = true

[lints]
workspace = true
