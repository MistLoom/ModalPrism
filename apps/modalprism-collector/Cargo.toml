[package]
name = "modalprism-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "一条命令初始化存储并进入采集循环"
publish = false
build = "build.rs"

[dependencies]
ability-core.workspace = true
ability-support.workspace = true
axum = "0.8"
modalprism-assembly = { path = "../modalprism-assembly" }
collector-runtime = { path = "../../crates/collector-runtime" }
console-api = { path = "../../crates/console-api" }
config = { path = "../../crates/config" }
frame-core.workspace = true
frame-port-http.workspace = true
mime_guess = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
types = { path = "../../crates/types" }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
strata-client = { path = "../../crates/strata-client" }
strata-model = { path = "../../crates/strata-model" }
tempfile.workspace = true

[lints]
workspace = true
