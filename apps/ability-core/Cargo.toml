[package]
name = "ability-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ability 运行引擎"

[lib]
name = "ability_core"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
ability-support = { workspace = true }
frame-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# 监测埋点编译开关。由 apps/monitor 的依赖声明自动启用：
# apps/monitor 依赖 ability-core 并开 monitor，feature 统一后全工作区生效。
monitor = ["ability-support/monitor"]

[dev-dependencies]
ability-probe = { path = "../../external/ability-probe" }
ability-sdk = { path = "../../SDK/ability-sdk" }
