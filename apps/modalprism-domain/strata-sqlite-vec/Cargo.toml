[package]
name = "strata-sqlite-vec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "把 sqlite-vec 注册成进程级 SQLite 自动扩展"
publish = false

[dependencies]
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
sqlite-vec = "0.1.9"

# 全仓唯一放开 unsafe 的 crate：SQLite 的自动扩展入口是 C 函数指针，
# 注册必须经过 `std::mem::transmute`。其余 crate 仍由 workspace 的 forbid 约束。
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"
