framework_version: "1"
id: strata_queue
open: false
protocols: [fun]
depends: []
stateful: true
factory: true
description: 控制库任务队列
config_schema:
  type: object
  properties:
    dataDir:
      type: string
    system:
      type: object
  required: [dataDir]
methods:
  - id: enqueue
    description: 写入任务
    input:
      type: object
      properties:
        tasks: { type: array }
      required: [tasks]
  - id: lease
    description: 租约一批任务
    input:
      type: object
  - id: extend
    description: 延长租约
    input:
      type: object
  - id: nack
    description: 退回任务
    input:
      type: object
  - id: lease_id
    description: 按任务 id 租约
    input:
      type: object
  - id: release_leases
    description: 释放过期租约
    input:
      type: object
  - id: active
    description: 队列是否已有活跃任务
    input:
      type: object
  - id: lease_ready
    description: 租约就绪任务
    input:
      type: object
  - id: lease_follows
    description: 租约 follow 任务
    input:
      type: object
  - id: leased_count
    description: 已租约数量
    input:
      type: object
  - id: apply
    description: 应用变更集（含 ack）
    input:
      type: object
  - id: accepted_cursor
    description: 已接受游标
    input:
      type: object
  - id: visible_cursor
    description: 可见游标
    input:
      type: object
