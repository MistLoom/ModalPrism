framework_version: "1"
id: store
leaf_builtin: true
open: true
protocols: [http, fun]
depends: []
stateful: true
factory: true
config_schema:
  type: object
  properties:
    data_root:
      type: string
    temp_root:
      type: string
    watch:
      type: boolean
events:
  - name: changed
    dir: emit
    description: 文件系统变更通知
    payload_schema:
      type: object
      properties:
        path: { type: string }
        op: { type: string }
      required: [path, op]
methods:
  - id: get
    description: 读取结构数据
    input:
      type: object
  - id: put
    description: 写入结构数据
    input:
      type: object
  - id: merge
    description: 深合并结构数据
    input:
      type: object
  - id: delete
    description: 删除
    input:
      type: object
  - id: exists
    description: 是否存在
    input:
      type: object
  - id: list
    description: 列举 key
    input:
      type: object
  - id: purge
    description: 按前缀删除
    input:
      type: object
  - id: stat
    description: 元信息
    input:
      type: object
  - id: blob_get
    description: 分块读二进制
    input:
      type: object
  - id: blob_put
    description: 写二进制
    input:
      type: object
  - id: blob_write
    description: 流式写二进制
    input:
      type: object
  - id: acquire
    description: 加锁
    input:
      type: object
  - id: release
    description: 解锁
    input:
      type: object
