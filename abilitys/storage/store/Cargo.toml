[package]
name = "ability-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ability store：统一存储门面"

[dependencies]
async-trait.workspace = true
ability-support.workspace = true
base64 = "0.22"
fs4 = "0.13"
notify = "6"
quick-xml = { version = "0.37", features = ["serialize"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
ability-sdk-codegen = { workspace = true }

[dev-dependencies]
ability-core.workspace = true
frame-port-fun.workspace = true
ability-store-persist = { workspace = true }
ability-store-temp = { workspace = true }
ability-markdown = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
