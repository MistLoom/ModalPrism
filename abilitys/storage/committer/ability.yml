framework_version: "1"
id: committer
open: false
protocols: [fun]
depends:
  - config
stateful: true
factory: false
description: 发布快照并恢复存储
config_schema:
  type: object
  properties:
    dataDir:
      type: string
    system:
      type: object
  required: [dataDir]
methods:
  - id: flush
    description: 发布已接受的变更
    input:
      type: object
  - id: maintain
    description: 恢复存储并返回目录
    input:
      type: object
  - id: recover
    description: 恢复存储
    input:
      type: object
  - id: status
    description: 返回控制库、Lance 和暂存区路径
    input:
      type: object
  - id: hotlist_apply
    description: 提交热榜差量变更集
    input:
      type: object
