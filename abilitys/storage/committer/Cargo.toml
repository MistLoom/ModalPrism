[package]
name = "ability-committer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "发布快照并恢复存储"
publish = false
build = "build.rs"

[dependencies]
ability-support.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
strata-client = { path = "../../../crates/strata-client" }
strata-shared = { path = "../strata-shared" }
config = { path = "../../../crates/config" }
types = { path = "../../../crates/types" }
strata-model = { path = "../../../crates/strata-model" }

[build-dependencies]
ability-sdk-codegen = { git = "https://github.com/MistLoom/LEAF", rev = "ffabb6128ae6e006c6c3cee3a706532501f26219" }

[dev-dependencies]
ability-core.workspace = true
ability-config = { path = "../../governance/config" }
config = { path = "../../../crates/config" }
ability-strata-read = { path = "../strata-read" }
frame-core.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
