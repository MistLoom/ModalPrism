framework_version: "1"
id: config
leaf_builtin: true
open: true
protocols: [http, fun]
depends: []
stateful: false
methods:
  - id: load
    description: 按路径加载配置（json/yaml/ini/conf/env）
    input:
      type: object
      properties:
        path:
          type: string
        format:
          type: string
          enum: [auto, json, yaml, ini, conf, env]
      required: [path]
  - id: env
    description: 读取进程环境变量；可指定 prefix 过滤
    input:
      type: object
      properties:
        prefix:
          type: string
        content:
          type: string
