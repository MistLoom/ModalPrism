[package]
  cjc-version = "1.2.0"
  name = "rawprism_guest"
  description = "Leaf Guest Ability wrapping the RawPrism text scan library (Cangjie)"
  output-type = "executable"
  compiler-option = ""
  code-root = "."
  src-dir = "src"
  target-dir = "target"
  version = "0.1.0"

[dependencies]
  rawprism = { git = "https://github.com/MistLoom/RawPrism.git", branch = "main", output-type = "static" }
  leaf_ability_sdk = { path = "../../../SDK/ability-sdk-cj", output-type = "static" }
