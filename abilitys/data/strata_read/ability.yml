framework_version: "1"
id: strata_read
open: true
protocols: [fun, http]
depends: []
stateful: true
description: 读取已发布的资源、facet 和变更
methods:
  - id: kinds
    description: 列出资源上的 facet 种类
    input:
      type: object
  - id: has
    description: 判断资源是否有某种 facet
    input:
      type: object
  - id: get
    description: 读取 facet 的版本与元数据
    input:
      type: object
  - id: slice
    description: 读取文本区间
    input:
      type: object
  - id: resolve
    description: 按身份键解析资源
    input:
      type: object
  - id: history
    description: 列出 facet 版本
    input:
      type: object
  - id: lineage
    description: 读取 facet 血缘
    input:
      type: object
  - id: related
    description: 读取资源关系
    input:
      type: object
  - id: query
    description: 按查询对象读取
    input:
      type: object
  - id: changes
    description: 读取已可见变更
    input:
      type: object
