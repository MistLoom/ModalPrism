framework_version: "1"
id: config_inspect
open: true
protocols: [fun]
depends: []
stateful: false
description: 检查配置而不替换快照
methods:
  - id: validate
    description: 重新校验配置目录
    input:
      type: object
  - id: diff
    description: 比较当前快照与目录
    input:
      type: object
  - id: explain
    description: 解释模块字段来源
    input:
      type: object
  - id: modules
    description: 列出有效模块配置
    input:
      type: object
