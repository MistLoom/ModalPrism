framework_version: "1"
id: config_inspect
open: true
protocols: [fun, http]
depends: []
stateful: true
factory: true
description: 配置校验与差异
config_schema:
  type: object
  properties:
    configDir:
      type: string
    dataDir:
      type: string
  required: [configDir, dataDir]
methods:
  - id: validate
    description: 重新校验配置目录
    input:
      type: object
  - id: diff
    description: 比较当前快照与目录
    input:
      type: object
  - id: explain
    description: 解释模块字段来源
    input:
      type: object
      properties:
        module: { type: string }
      required: [module]
