framework_version: "1"
id: workflow
open: true
protocols: [fun, http, mcp, tools]
depends: [strata_read, strata_write]
stateful: false
description: 内容加工工作流与模型的管理、运行与通知
methods:
  - id: catalog
    description: 工作流、模型与新建模板
    input:
      type: object
  - id: get
    description: 读取一条工作流声明
    input:
      type: object
      properties:
        slug: { type: string }
      required: [slug]
  - id: notify_test
    description: 试投一条 webhook 或飞书通知
    input:
      type: object
      properties:
        kind: { type: string, enum: [webhook, feishu] }
        url: { type: string }
        title: { type: string }
      required: [url]
  - id: remove
    description: 删除一条工作流
    input:
      type: object
      properties:
        slug: { type: string }
      required: [slug]
  - id: remove_model
    description: 删除一个模型声明
    input:
      type: object
      properties:
        slug: { type: string }
      required: [slug]
  - id: run
    description: 手动对一篇文章运行工作流
    input:
      type: object
      properties:
        slug: { type: string }
        rid: { type: string }
      required: [slug, rid]
  - id: runs
    description: 最近的运行记录
    input:
      type: object
      properties:
        limit: { type: integer }
  - id: save
    description: 新建或改写工作流
    input:
      type: object
      description: WorkflowSpec 的 camelCase JSON，由工作流引擎校验
  - id: save_model
    description: 新建或改写模型
    input:
      type: object
      description: ModelSpec 的 camelCase JSON，由工作流引擎校验
  - id: tick
    description: 处理游标之后的新文章
    input:
      type: object
  - id: toggle
    description: 启用或停用一条工作流
    input:
      type: object
      properties:
        slug: { type: string }
        enabled: { type: boolean }
      required: [slug, enabled]
