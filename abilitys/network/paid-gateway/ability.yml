framework_version: "1"
id: paid_gateway
open: false
protocols: [fun]
depends:
  - config
stateful: true
factory: true
description: 付费回执网关
config_schema:
  type: object
  properties:
    dataDir:
      type: string
    system:
      type: object
  required: [dataDir]
methods:
  - id: reserve
    description: 占位方法，不扣费
    input:
      type: object
  - id: complete
    description: 确认回执
    input:
      type: object
      properties:
        receiptId: { type: string }
      required: [receiptId]
  - id: status
    description: 读取回执状态
    input:
      type: object
      properties:
        receiptId: { type: string }
      required: [receiptId]
  - id: call
    description: 经付费网关执行请求
    input:
      type: object
      properties:
        endpoint: { type: string }
        headers:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string }
        body: {}
        params: { type: object }
        policy: { type: object }
      required: [endpoint, headers, body, params]
