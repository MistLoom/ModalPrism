framework_version: "1"
id: egress
open: false
protocols: [fun]
depends:
  - config
stateful: true
factory: true
description: 出站策略与连通性检查
config_schema:
  type: object
  properties:
    dataDir: { type: string }
    system: { type: object }
    proxyUrl: { type: string }
    proxyListen: { type: string }
  required: [dataDir]
methods:
  - id: check
    description: 检查 URL 是否被策略阻断
    input:
      type: object
      properties:
        url: { type: string }
      required: [url]
  - id: status
    description: 当前代理地址
    input:
      type: object
  - id: governance_domains
    description: 出站熔断域列表
    input:
      type: object
  - id: reset_circuit
    description: 重置指定主机的熔断器
    input:
      type: object
      properties:
        host: { type: string }
        confirm: { type: boolean }
      required: [host]
  - id: http_request
    description: 经出站网关执行 HTTP 请求（进程内访问器专用）
    input:
      type: object
      properties:
        method: { type: string }
        url: { type: string }
        headers:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string }
        body: {}
        modulePolicy:
          type: object
      required: [method, url, headers, body]
