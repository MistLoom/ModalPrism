framework_version: "1"
id: runner
open: false
protocols: [fun]
depends:
  - config
  - strata_queue
  - strata_write
  - strata_read
  - egress
  - paid_gateway
  - control_state
  - accessor_http
  - accessor_rss
  - accessor_api
  - accessor_paid_api
  - accessor_search
  - accessor_push
  - accessor_file
  - accessor_browser
  - accessor_bundle_list
stateful: true
factory: false
description: 执行已租约任务
config_schema:
  type: object
  properties:
    dataDir:
      type: string
    configDir:
      type: string
    system:
      type: object
    proxyUrl:
      type: string
    browserProgram:
      type: string
  required: [dataDir, configDir]
methods:
  - id: run_task
    description: 执行一个任务
    input:
      type: object
      properties:
        task: { type: object }
      required: [task]
