framework_version: "1"
id: planner
open: false
protocols: [fun]
depends:
  - config
  - strata_queue
  - control_state
stateful: false
factory: false
description: 扫描到期信源并租约任务
methods:
  - id: tick
    description: 派出到期任务
    input:
      type: object
  - id: trigger
    description: 把信源标成到期并派出
    input:
      type: object
      properties:
        source: { type: string }
      required: [source]
  - id: next
    description: 读取信源的下一次时间
    input:
      type: object
      properties:
        source: { type: string }
      required: [source]
