id: adapter/table-records
kind: adapter
name: 表格记录
implementation: builtin:table-records
role: search
consumes:
  - {kind: raw, part_role: document, media_type: text/html}
produces: [discovery]
limits:
  timeout: 30s
  concurrency: 1
  retry:
    attempts: 0
    backoff: exponential
    base: 1s
    max: 30s
