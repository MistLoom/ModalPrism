id: adapter/jsonld-struct
kind: adapter
name: 结构化数据
description: 读取页面里的 JSON-LD 声明，产出结构化数据面。
implementation: builtin:jsonld-struct
role: content
consumes:
  - {kind: raw, part_role: document, media_type: text/html}
produces:
  - {kind: struct, variant: jsonld}
limits:
  timeout: 30s
  concurrency: 1
  retry:
    attempts: 0
    backoff: exponential
    base: 1s
    max: 30s
