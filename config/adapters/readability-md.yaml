id: adapter/readability-md
kind: adapter
name: 正文抽取
description: 从 HTML 页面抽出正文，产出可读 Markdown 与纯文本两份数据面。
implementation: builtin:readability-md
role: content
consumes:
  - {kind: raw, part_role: document, media_type: text/html}
produces:
  - {kind: md, variant: readable}
  - {kind: text}
limits:
  timeout: 30s
  concurrency: 1
  retry:
    attempts: 0
    backoff: exponential
    base: 1s
    max: 30s
