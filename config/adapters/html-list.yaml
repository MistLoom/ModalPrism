id: adapter/html-list
kind: adapter
name: 网页列表
# 默认适配器示例：列表页（新闻、博客首页）用这一条抽取条目链接。
description: 从网页正文抽取列表条目链接与标题；列表页、博客首页等 HTML 信源默认使用。
implementation: builtin:html-list
role: search
consumes:
  - {kind: raw, part_role: document, media_type: text/html}
  - {kind: raw, part_role: document, media_type: text/markdown}
  - {kind: raw, part_role: document, media_type: text/plain}
produces: [discovery]
limits:
  timeout: 30s
  concurrency: 1
  retry:
    attempts: 0
    backoff: exponential
    base: 1s
    max: 30s
