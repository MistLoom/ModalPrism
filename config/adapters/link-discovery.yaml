id: adapter/link-discovery
kind: adapter
name: 链接发现
description: 从页面里的超链接推断条目，用于没有列表结构的入口页。
implementation: builtin:link-discovery
role: search
consumes:
  - {kind: raw, part_role: document, media_type: text/html}
produces: [discovery]
limits:
  timeout: 30s
  concurrency: 1
  retry:
    attempts: 0
    backoff: exponential
    base: 1s
    max: 30s
