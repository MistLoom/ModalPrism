access:
  accessor: accessor/paid-api
  locator:
    endpoint: "https://www.dajiala.com/fbmain/monitor/v3/post_history"
  spec:
    body: "{\"ghid\":\"gh_example\",\"key\":\"${env:DAJIALA_KEY}\",\"verifycode\":\"\"}"
    method: POST
    service: dajiala
admission: {}
description: 公众号历史列表。声明不含密钥。
enabled: false
id: source/wechat-account
kind: source
name: 公众号
paid:
  budget:
    requests: 12
    window: 1d
pipeline:
  - run:
      - adapter/json-list
    spec:
      adapter/json-list:
        items: /data
        publishedAtPath: post_time
        publishedAtUnit: epoch_s
        summary: digest
        title: title
        url: url
project: proj_default
shared: true
sourceType: api
