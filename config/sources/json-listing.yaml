id: source/json-listing
kind: source
name: JSON 列表示例
enabled: false
access:
  accessor: accessor/api
  locator:
    endpoint: https://example.com/api/news
pipeline:
  - run: [adapter/json-list]
    spec:
      adapter/json-list:
        itemsPath: data.items
        urlTemplate: "https://example.com/posts/{id}"
        titlePaths: [title, name]
        summaryPaths: [summary]
        publishedAtPath: published_at
        externalIdPath: id
schedule:
  interval: 1h
admission: {}
