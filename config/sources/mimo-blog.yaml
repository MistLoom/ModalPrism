access:
  accessor: accessor/bundle-list
  locator:
    url: "https://mimo.xiaomi.com/"
  spec:
    extract:
      - endMarker: "sectionTitle:"
        fields:
          - title
          - link
          - desc
        marker: "sectionTitle:\"Blog\""
        type: quoted-fields
      - lang: en
        routePrefix: /blog/
        skip:
          - /blog/
          - /blog/index
          - /blog/blog1
        type: route-record
    maxScriptBytes: 1048576
    maxScripts: 8
admission:
  allowUrlPrefixes:
    - "https://mimo.xiaomi.com/blog/"
id: source/mimo-blog
kind: source
labels:
  tier: T1
  topic: 官方
name: Xiaomi MiMo
pipeline:
  - run:
      - adapter/json-list
    spec:
      adapter/json-list:
        detail:
          fields:
            - publishedAt
            - title
          maxFetches: 30
        items: /items
        publishedAt: publishedAt
        publishedAtUtcOffset: "+08:00"
        summary: summary
        title: title
        url: url
  - for: follow
    run:
      - adapter/page-fields
    spec:
      adapter/page-fields:
        publishedAt: time.hero-date
        publishedAtAttr: datetime
        publishedAtUtcOffset: "+08:00"
        summary: p.hero-subtitle
        title: h1.hero-title
project: proj_default
shared: true
sourceType: web
groupId: grp_builtin_ai_labs
