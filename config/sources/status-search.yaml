access:
  accessor: accessor/paid-api
  locator:
    endpoint: "https://api.socialdata.tools/twitter/search"
  spec:
    headers:
      - - Authorization
        - "Bearer ${env:SOCIALDATA_API_KEY}"
    method: GET
    params:
      query: "from:example -filter:replies"
      type: Latest
    service: socialdata
admission: {}
description: 查询最新公开状态。声明不含密钥。
enabled: false
id: source/status-search
kind: source
name: 状态搜索
paid:
  budget:
    requests: 48
    window: 1d
pipeline:
  - run:
      - adapter/json-list
    spec:
      adapter/json-list:
        authorPaths:
          - user.screen_name
        decodeEntities: true
        externalIdPath: id_str
        items: /tweets
        publishedAtPath: tweet_created_at
        summaryIsBody: true
        summaryPaths:
          - full_text
          - text
        titlePaths:
          - full_text
          - text
        urlTemplate: "https://x.com/{user.screen_name}/status/{id_str}"
project: proj_default
shared: true
sourceType: search
