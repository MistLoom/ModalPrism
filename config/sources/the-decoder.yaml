id: source/the-decoder
kind: source
name: "The Decoder"
labels:
  tier: T2
  topic: "媒体"
access:
  accessor: accessor/rss
  locator:
    url: https://the-decoder.com/feed/
pipeline:
  - run: [adapter/feed-items]
policy:
  robots:
    mode: ignore
    robots_reason: 站点 robots 禁止全部订阅路径，该信源的采集对象就是这条订阅地址
schedule:
  interval: 1h
admission:
  initialBackfill:
    limit: 8
    maxAge: 365d
