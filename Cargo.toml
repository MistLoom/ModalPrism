[workspace]
resolver = "2"
members = [
    "crates/strata-model",
    "crates/strata-store",
    "crates/strata-client",
    "crates/config",
    "crates/accessors",
    "crates/adapters",
    "crates/egress",
    "crates/paid",
    "crates/planner",
    "crates/accessors-builtin",
    "crates/host",
    "crates/console",
    "crates/console-api",
    "crates/types",
    "ability/strata_read",
    "ability/strata_write",
    "ability/strata_queue",
    "ability/committer",
    "ability/planner",
    "ability/runner",
    "ability/health",
    "ability/config",
    "ability/config_inspect",
    "ability/egress",
    "ability/paid_gateway",
    "ability/accessor_http",
    "ability/accessor_rss",
    "ability/accessor_api",
    "ability/accessor_paid_api",
    "ability/accessor_search",
    "ability/accessor_push",
    "ability/accessor_file",
    "ability/accessor_browser",
    "apps/modalprism-collector",
    "ability/type_article",
    "ability/type_hotlist",
    "apps/modalprism-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ulid = "1"
humantime-serde = "1"
arrow-array = "58"
arrow-buffer = "58"
arrow-schema = "58"
bytes = "1"
futures = "0.3"
lance = "=13.0.0"
lancedb = { version = "=0.40.0", features = ["remote"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
jsonschema = "0.59"
notify = "8.2"
saphyr = "0.2.2"
signal-hook = { version = "0.3", features = ["iterator"] }
async-trait = "0.1"
quick-xml = "0.37"
scraper = "0.23"
url = "2"
psl = "2"
flate2 = "1"
base64 = "0.22"
ability-support = { git = "https://github.com/MistLoom/LEAF", rev = "ffabb6128ae6e006c6c3cee3a706532501f26219" }
frame-core = { git = "https://github.com/MistLoom/LEAF", rev = "ffabb6128ae6e006c6c3cee3a706532501f26219" }
ability-core = { git = "https://github.com/MistLoom/LEAF", rev = "ffabb6128ae6e006c6c3cee3a706532501f26219" }
frame-port-http = { git = "https://github.com/MistLoom/LEAF", rev = "ffabb6128ae6e006c6c3cee3a706532501f26219" }
frame-port-mcp = { git = "https://github.com/MistLoom/LEAF", rev = "ffabb6128ae6e006c6c3cee3a706532501f26219" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
