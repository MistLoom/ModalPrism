[workspace]
resolver = "2"
members = [
    "frame/support/macros",
    "frame/support",
    "frame/protocol",
    "frame/core",
    "frame/compose",
    "frame/port-cli",
    "frame/port-http",
    "frame/port-mcp",
    "frame/port-fun",
    "frame/port-grpc",
    "apps/ability-core",
    "apps/monitor",
    "apps/modalprism-domain/strata-model",
    "apps/modalprism-domain/strata-sqlite-vec",
    "apps/modalprism-domain/strata-gateway",
    "apps/modalprism-domain/strata-client",
    "apps/modalprism-domain/config",
    "apps/modalprism-domain/dictionary",
    "apps/modalprism-domain/api",
    "apps/modalprism-domain/types",
    "apps/modalprism-domain/surface",
    "apps/modalprism-domain/workflow",
    "apps/modalprism-collector/subsystems/accessors",
    "apps/modalprism-collector/subsystems/accessors-builtin",
    "apps/modalprism-collector/subsystems/adapters",
    "apps/modalprism-collector/subsystems/egress",
    "apps/modalprism-collector/subsystems/paid",
    "apps/modalprism-collector/subsystems/planner",
    "apps/modalprism-collector/subsystems/assembly",
    "abilitys/config/config",
    "abilitys/storage/store",
    "abilitys/storage/store_persist",
    "abilitys/storage/store_temp",
    "abilitys/content/markdown",
    "abilitys/fs/read_file",
    "abilitys/fs/write_file",
    "abilitys/fs/bash",
    "abilitys/workflow/todo_write",
    "abilitys/workflow/task",
    "abilitys/sample/echo",
    "abilitys/sample/counter",
    "abilitys/sample/shout",
    "abilitys/eco/plugin_host",
    "abilitys/eco/claude_mod",
    "abilitys/eco/dsh_plugin",
    "apps/agent-test/ability/skill",
    "apps/agent-test/ability/prompt",
    "apps/agent-test/ability/dispatch",
    "apps/agent-test/ability/chat",
    "apps/agent-test/ability/turn",
    "apps/agent-test/ability/session",
    "abilitys/types/type_article",
    "abilitys/types/type_hotlist",
    "abilitys/data/strata_read",
    "abilitys/data/config_inspect",
    "abilitys/data/catalog_admin",
    "abilitys/ops/health",
    "apps/modalprism-collector/ability/accessor_probe",
    "apps/modalprism-collector/ability/committer",
    "apps/modalprism-collector/ability/config_admin",
    "apps/modalprism-collector/ability/content_admin",
    "apps/modalprism-collector/ability/egress",
    "apps/modalprism-collector/ability/health_record",
    "apps/modalprism-collector/ability/paid_gateway",
    "apps/modalprism-collector/ability/planner",
    "apps/modalprism-collector/ability/runner",
    "apps/modalprism-collector/ability/strata_queue",
    "apps/modalprism-collector/ability/strata_write",
    "apps/modalprism-collector/ability/tool",
    "apps/modalprism-collector",
    "apps/modalprism-agent",
]
default-members = ["apps/modalprism-collector", "apps/modalprism-agent"]

exclude = ["external/ability-probe", "SDK/ability-sdk", "SDK/ability-sdk-codegen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
ability-support = { path = "frame/support" }
ability-support-macros = { path = "frame/support/macros" }
frame-core = { path = "frame/core" }
frame-compose = { path = "frame/compose" }
ability-core = { path = "apps/ability-core" }
frame-port-cli = { path = "frame/port-cli" }
frame-port-http = { path = "frame/port-http" }
frame-port-mcp = { path = "frame/port-mcp" }
frame-port-fun = { path = "frame/port-fun" }
frame-port-grpc = { path = "frame/port-grpc" }
ability-sdk-codegen = { path = "SDK/ability-sdk-codegen" }
ability-config = { path = "abilitys/config/config" }
ability-store = { path = "abilitys/storage/store" }
ability-store-persist = { path = "abilitys/storage/store_persist" }
ability-store-temp = { path = "abilitys/storage/store_temp" }
ability-markdown = { path = "abilitys/content/markdown" }
ability-read-file = { path = "abilitys/fs/read_file" }
ability-write-file = { path = "abilitys/fs/write_file" }
ability-bash = { path = "abilitys/fs/bash" }
ability-todo-write = { path = "abilitys/workflow/todo_write" }
ability-echo = { path = "abilitys/sample/echo" }
ability-counter = { path = "abilitys/sample/counter" }
ability-shout = { path = "abilitys/sample/shout" }
ability-task = { path = "abilitys/workflow/task" }
ai-protocol = { path = "frame/protocol" }
ai-skill = { path = "apps/agent-test/ability/skill" }
ai-prompt = { path = "apps/agent-test/ability/prompt" }
ai-dispatch = { path = "apps/agent-test/ability/dispatch" }
ai-chat = { path = "apps/agent-test/ability/chat" }
ai-turn = { path = "apps/agent-test/ability/turn" }
ai-session = { path = "apps/agent-test/ability/session" }
ability-plugin-host = { path = "abilitys/eco/plugin_host" }
ability-claude-mod = { path = "abilitys/eco/claude_mod" }
ability-dsh-plugin = { path = "abilitys/eco/dsh_plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ulid = "1"
humantime-serde = "1"
bytes = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
jsonschema = "0.59"
notify = "8.2"
saphyr = "0.2.2"
ordered-float = "5"
signal-hook = { version = "0.3", features = ["iterator"] }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-io"] }
scraper = "0.23"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
psl = "2"
flate2 = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1

# 开发/测试构建产物瘦身：Windows MSVC 的全量 debuginfo 会让每个 crate 的 .pdb 达数 GB。
# 仅为本仓库代码保留行表（栈回溯/断点仍可用），依赖一律去调试信息（体积大头）。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
