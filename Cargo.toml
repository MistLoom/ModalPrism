[workspace]
resolver = "2"
members = [
    "frame/support/macros",
    "frame/support",
    "frame/protocol",
    "frame/core",
    "frame/compose",
    "frame/port-cli",
    "frame/port-http",
    "frame/port-mcp",
    "frame/port-fun",
    "frame/port-grpc",
    "apps/ability-core",
    "apps/modalprism-domain/strata-model",
    "apps/modalprism-domain/strata-sqlite-vec",
    "apps/modalprism-domain/strata-gateway",
    "apps/modalprism-domain/strata-client",
    "apps/modalprism-domain/config",
    "apps/modalprism-domain/types",
    "apps/modalprism-domain/surface",
    "apps/modalprism-domain/workflow",
    "apps/modalprism-collector/subsystems/accessors",
    "apps/modalprism-collector/subsystems/accessors-builtin",
    "apps/modalprism-collector/subsystems/adapters",
    "apps/modalprism-collector/subsystems/egress",
    "apps/modalprism-collector/subsystems/paid",
    "apps/modalprism-collector/subsystems/planner",
    "apps/modalprism-collector/subsystems/assembly",
    "abilitys/types/type_article",
    "abilitys/types/type_hotlist",
    "abilitys/data/strata_read",
    "abilitys/data/config_inspect",
    "abilitys/data/catalog_admin",
    "abilitys/ops/health",
    "abilitys/ops/workflow",
    "apps/modalprism-collector/ability/accessor_probe",
    "apps/modalprism-collector/ability/committer",
    "apps/modalprism-collector/ability/config_admin",
    "apps/modalprism-collector/ability/content_admin",
    "apps/modalprism-collector/ability/egress",
    "apps/modalprism-collector/ability/health_record",
    "apps/modalprism-collector/ability/paid_gateway",
    "apps/modalprism-collector/ability/planner",
    "apps/modalprism-collector/ability/runner",
    "apps/modalprism-collector/ability/strata_queue",
    "apps/modalprism-collector/ability/strata_write",
    "apps/modalprism-collector",
    "apps/modalprism-agent",
    "apps/modalprism-console",
]
default-members = ["apps/modalprism-collector", "apps/modalprism-agent"]

exclude = ["external/ability-probe", "SDK/ability-sdk", "SDK/ability-sdk-codegen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
ability-support = { path = "frame/support" }
ability-support-macros = { path = "frame/support/macros" }
frame-core = { path = "frame/core" }
frame-compose = { path = "frame/compose" }
ability-core = { path = "apps/ability-core" }
frame-port-cli = { path = "frame/port-cli" }
frame-port-http = { path = "frame/port-http" }
frame-port-mcp = { path = "frame/port-mcp" }
frame-port-fun = { path = "frame/port-fun" }
frame-port-grpc = { path = "frame/port-grpc" }
ai-protocol = { path = "frame/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ulid = "1"
humantime-serde = "1"
bytes = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
jsonschema = "0.59"
notify = "8.2"
saphyr = "0.2.2"
signal-hook = { version = "0.3", features = ["iterator"] }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-io"] }
scraper = "0.23"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
psl = "2"
flate2 = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
