[workspace]
resolver = "2"
members = ["crates/strata-model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ulid = "1"
humantime-serde = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
