[package]
name = "ability-sdk-codegen"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Ability 声明文件代码生成（build.rs 依赖）"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ability-sdk-codegen"
path = "src/main.rs"

[dependencies]
ability-support = { path = "../../frame/support" }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
