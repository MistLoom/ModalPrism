[package]
name = "ability-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Ability 作者 SDK。只依赖 ability-support，不依赖 frame-core / port"

[dependencies]
ability-support = { path = "../../frame/support" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "rt", "rt-multi-thread", "sync"] }
